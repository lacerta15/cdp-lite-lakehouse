# CDP-Lite Ansible inventory.
# Replace `lakehouse-host.example.com` with your RHEL/Rocky 8/9 server.
# This stack is single-host; use one machine with >= 8 GB RAM.

[lakehouse]
lakehouse-host.example.com ansible_user=cdp_admin ansible_become=true

[lakehouse:vars]
ansible_python_interpreter=/usr/bin/python3
project_root=/opt/cdp-lite-lakehouse
git_repo=https://github.com/your-handle/cdp-lite-lakehouse.git
git_branch=main
