apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cdp-lite
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cdp-lite
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - { name: POSTGRES_DB,   value: metastore }
            - { name: POSTGRES_USER, value: hive }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lakehouse-creds, key: POSTGRES_PASSWORD }
          ports:
            - { containerPort: 5432, name: pg }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hive", "-d", "metastore"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cdp-lite
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { port: 5432, targetPort: 5432 }
