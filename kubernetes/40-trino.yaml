apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: cdp-lite
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=1GB
  node.properties: |
    node.environment=cdp_lite
    node.data-dir=/data/trino
  jvm.config: |
    -server
    -Xmx2G
    -XX:+ExitOnOutOfMemoryError
    -XX:+HeapDumpOnOutOfMemoryError
  hive.properties: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore:9083
    hive.s3.endpoint=http://minio:9000
    hive.s3.aws-access-key=minio
    hive.s3.aws-secret-key=minio123
    hive.s3.path-style-access=true
    hive.s3.ssl.enabled=false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: cdp-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
    spec:
      containers:
        - name: trino
          image: trinodb/trino:435
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /v1/info, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          volumeMounts:
            - { name: cfg,     mountPath: /etc/trino/config.properties, subPath: config.properties }
            - { name: cfg,     mountPath: /etc/trino/node.properties,   subPath: node.properties }
            - { name: cfg,     mountPath: /etc/trino/jvm.config,        subPath: jvm.config }
            - { name: catalog, mountPath: /etc/trino/catalog/hive.properties, subPath: hive.properties }
      volumes:
        - name: cfg
          configMap: { name: trino-config }
        - name: catalog
          configMap: { name: trino-config }
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: cdp-lite
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trino
  ports:
    - { port: 8080, targetPort: 8080 }
