apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: cdp-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-master
    spec:
      containers:
        - name: spark-master
          image: REGISTRY/cdp-lite-spark:3.5.0
          command: ["/opt/spark/sbin/start-master.sh", "-h", "spark-master"]
          ports:
            - { containerPort: 7077, name: rpc }
            - { containerPort: 8080, name: ui }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: cdp-lite
spec:
  selector:
    app.kubernetes.io/name: spark-master
  ports:
    - { name: rpc, port: 7077, targetPort: 7077 }
    - { name: ui,  port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: cdp-lite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: REGISTRY/cdp-lite-spark:3.5.0
          command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
          env:
            - { name: SPARK_WORKER_CORES,  value: "1" }
            - { name: SPARK_WORKER_MEMORY, value: "1g" }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
