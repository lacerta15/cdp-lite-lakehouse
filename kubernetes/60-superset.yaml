apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-home
  namespace: cdp-lite
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: cdp-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset
    spec:
      containers:
        - name: superset
          image: REGISTRY/cdp-lite-superset:3.0.1
          env:
            - { name: SUPERSET_SECRET_KEY,    value: "change-me-please-32-chars-min!!" }
            - { name: ADMIN_USERNAME,         value: admin }
            - { name: ADMIN_EMAIL,            value: admin@cdp-lite.local }
            - { name: ADMIN_PASSWORD,         value: admin }
          ports:
            - { containerPort: 8088, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 8088 }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          volumeMounts:
            - { name: home, mountPath: /app/superset_home }
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: superset-home
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: cdp-lite
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: superset
  ports:
    - { port: 8088, targetPort: 8088 }
