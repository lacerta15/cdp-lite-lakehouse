# Kustomize entry point. Apply with:
#   kubectl apply -k kubernetes/
#
# To switch image registry to your Docker Hub user:
#   cd kubernetes/
#   kustomize edit set image REGISTRY/cdp-lite-hive-metastore=YOUR_DOCKERHUB/cdp-lite-hive-metastore:3.1.3
#   kustomize edit set image REGISTRY/cdp-lite-spark=YOUR_DOCKERHUB/cdp-lite-spark:3.5.0
#   kustomize edit set image REGISTRY/cdp-lite-superset=YOUR_DOCKERHUB/cdp-lite-superset:3.0.1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cdp-lite

resources:
  - 00-namespace.yaml
  - 10-minio.yaml
  - 20-postgres.yaml
  - 30-hive-metastore.yaml
  - 40-trino.yaml
  - 50-spark.yaml
  - 60-superset.yaml

commonLabels:
  app.kubernetes.io/part-of: cdp-lite-lakehouse

images:
  - name: REGISTRY/cdp-lite-hive-metastore
    newName: your-dockerhub/cdp-lite-hive-metastore
    newTag: "3.1.3"
  - name: REGISTRY/cdp-lite-spark
    newName: your-dockerhub/cdp-lite-spark
    newTag: "3.5.0"
  - name: REGISTRY/cdp-lite-superset
    newName: your-dockerhub/cdp-lite-superset
    newTag: "3.0.1"
